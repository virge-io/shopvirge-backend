# Read the Docs configuration (v2).
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# After merging this file:
#   1. Sign in at https://readthedocs.org with the GitHub account that owns this repo.
#   2. "Import a Project" -> select virge-io/shopvirge-backend.
#   3. RTD auto-detects this file; no extra settings required.
#   4. First build triggers automatically; subsequent builds trigger via the
#      GitHub webhook RTD installs for you.
# For private repos, use https://readthedocs.com (RTD for Business) instead.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    install:
      # Dependencies live in pyproject.toml / uv.lock; the docs stack is the
      # `docs` dependency group. `--locked` fails the build if the lock is stale.
      - pip install uv==0.11.19
      - uv sync --locked --only-group docs
    build:
      html:
        - uv run mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
